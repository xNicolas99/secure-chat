name: Android CI

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Tests and Lint
      run: ./gradlew test lint

    - name: Build Release APKs
      run: ./gradlew :app:assembleRelease

    - name: Upload Play Release APK
      uses: actions/upload-artifact@v4
      with:
        name: play-release-apk
        path: app/build/outputs/apk/play/release/app-play-release-unsigned.apk

    - name: Upload Sideload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: sideload-release-apk
        path: app/build/outputs/apk/sideload/release/app-sideload-release-unsigned.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          app/build/outputs/apk/sideload/release/*.apk
          app/build/outputs/apk/play/release/*.apk
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
